# Server template. Configure .env for production SSO and put an HTTPS reverse
# proxy in front. The quick local demo uses the README's Python commands.
services:
  web:
    build: .
    init: true
    env_file:
      - .env
    environment:
      DEBUG: "False"
      ALLOW_DEMO_LOGIN: "False"
      # Named-volume SQLite is useful for a small single-host evaluation.
      # Supply a PostgreSQL URL in .env for a school deployment.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/db.sqlite3}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - grade_data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  grade_data:
